version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - nvm install 20
        - nvm use 20
        - node --version
        - cd frontend/dashboard && npm install 
    build:
      commands:
        - cd frontend/dashboard && npm run build 
  artifacts:
    baseDirectory: frontend/dashboard/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/dashboard/node_modules/**/*