version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - nvm use 20 || nvm install 20
        - node --version
        - cd frontend/dashboard && npm ci
    build:
      commands:
        - nvm use 20
        - cd frontend/dashboard && npm run build
  artifacts:
    baseDirectory: frontend/dashboard/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/dashboard/node_modules/**/*